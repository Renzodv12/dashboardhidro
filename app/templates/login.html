{% extends 'base.html' %}{% block content %}<section class="panel login"><p class="eyebrow">ACCESO LOCAL</p><h1>Ingresar al sistema</h1>{% if error %}<p class="alert alert-danger" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><label class="d-block mb-3">Usuario<input class="form-control" name="username" required maxlength="40" autocomplete="username"></label><label class="d-block mb-3">Contraseña<input class="form-control" type="password" name="password" required maxlength="128" autocomplete="current-password"></label><button class="btn btn-success">Ingresar</button></form><p class="note mt-3">Solicitá una cuenta al administrador del prototipo.</p></section>{% endblock %}
